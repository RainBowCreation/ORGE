pluginManagement {
    repositories {
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
    }
}

rootProject.name = "orge"

// DESIGN.md §1: "core + <loader>-<version>" modules over Architectury's
// common/fabric/neoforge mechanism.
include "core"
include "fabric-1.21"
include "neoforge-1.21"
